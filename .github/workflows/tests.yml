name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: >-
          python -m mypy --python-version 3.11
          gps/db.py gps/services.py gps/history.py gps/imports.py gps/inventory.py
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.python }}
          path: coverage.xml
      - uses: codecov/codecov-action@v5
        if: matrix.python == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
